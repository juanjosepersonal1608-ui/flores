<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti - Ramo de Tulipanes Encantado</title>
  <!-- Fuentes elegantes de Google Fonts para la frase romántica -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    /* =========================================
       RESET Y ESCENARIO NOCTURNO ENCANTADO
       ========================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Cormorant Garamond', Georgia, serif;
      background: #070b19;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 75% 18%, #1e2d5a 0%, #101935 38%, #080d1e 75%, #040711 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    /* Resplandor ambiental mágico detrás del ramo */
    .scene::before {
      content: '';
      position: absolute;
      bottom: 12vh;
      left: 50%;
      transform: translateX(-50%);
      width: min(85vw, 540px);
      height: min(85vw, 540px);
      background: radial-gradient(circle, rgba(255, 117, 143, 0.16) 0%, rgba(181, 23, 158, 0.08) 45%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }

    /* =========================================
       LUNA LLENA Y CIELO ESTRELLADO
       ========================================= */
    .moon {
      position: absolute;
      top: 6vh;
      right: 10vw;
      width: clamp(68px, 10vw, 105px);
      height: clamp(68px, 10vw, 105px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffdf5 0%, #fef3c7 55%, #fde68a 100%);
      box-shadow:
        0 0 30px 10px rgba(254, 243, 199, 0.45),
        0 0 75px 25px rgba(253, 230, 138, 0.22),
        0 0 130px 45px rgba(147, 197, 253, 0.12);
      z-index: 2;
      animation: moonFloat 7s ease-in-out infinite alternate;
    }

    @keyframes moonFloat {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-6px) scale(1.03); }
    }

    .stars {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.8);
      animation: twinkle var(--dur, 3s) ease-in-out infinite alternate;
      animation-delay: var(--delay, 0s);
    }

    @keyframes twinkle {
      0% { opacity: 0.25; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.25); }
    }

    /* =========================================
       LUCIÉRNAGAS MÁGICAS
       ========================================= */
    .fireflies {
      position: absolute;
      inset: 0;
      z-index: 16;
      pointer-events: none;
    }

    .firefly {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fef08a;
      box-shadow: 0 0 10px 3px #fde047, 0 0 20px 6px rgba(250, 204, 21, 0.55);
      animation:
        fireflyMove var(--float-dur, 12s) ease-in-out infinite alternate,
        fireflyGlow var(--glow-dur, 2.5s) ease-in-out infinite alternate;
      animation-delay: var(--delay, 0s);
    }

    @keyframes fireflyMove {
      0% { transform: translate(0, 0); }
      33% { transform: translate(var(--dx1, 30px), var(--dy1, -40px)); }
      66% { transform: translate(var(--dx2, -25px), var(--dy2, -80px)); }
      100% { transform: translate(var(--dx3, 20px), var(--dy3, -30px)); }
    }

    @keyframes fireflyGlow {
      0% { opacity: 0.2; transform: scale(0.7); }
      100% { opacity: 1; transform: scale(1.3); }
    }

    /* =========================================
       TARJETA DE CRISTAL CON FRASES DE PELÍCULAS
       ========================================= */
    .quote-container {
      position: relative;
      z-index: 20;
      margin-top: clamp(1.2rem, 3.5vh, 2.5rem);
      width: min(90vw, 620px);
      padding: 1.25rem 1.75rem;
      background: rgba(15, 23, 42, 0.52);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 228, 230, 0.25);
      border-radius: 24px;
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.22);
      text-align: center;
      color: #fff1f2;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .quote-container.pulse {
      transform: scale(1.025);
      box-shadow:
        0 20px 45px rgba(255, 77, 109, 0.28),
        inset 0 1px 2px rgba(255, 255, 255, 0.35);
    }

    .quote-ornament {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.72rem, 1.8vw, 0.88rem);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #fde68a;
      margin-bottom: 0.55rem;
      text-shadow: 0 0 10px rgba(253, 230, 138, 0.45);
    }

    .quote-text {
      font-size: clamp(1.12rem, 2.7vw, 1.48rem);
      line-height: 1.45;
      font-style: italic;
      color: #f8fafc;
      transition: opacity 0.25s ease;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
    }

    .quote-text .highlight {
      color: #ffccd5;
      font-weight: 600;
      text-shadow: 0 0 14px rgba(255, 117, 143, 0.7);
    }

    .quote-author {
      margin-top: 0.6rem;
      font-family: 'Cinzel', serif;
      font-size: clamp(0.82rem, 2vw, 0.98rem);
      font-weight: 700;
      color: #fbcfe8;
      letter-spacing: 0.06em;
      transition: opacity 0.25s ease;
    }

    .hint-badge {
      display: inline-block;
      margin-top: 0.7rem;
      padding: 0.3rem 0.9rem;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: clamp(0.72rem, 1.7vw, 0.82rem);
      color: #fef3c7;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(253, 230, 138, 0.28);
      border-radius: 999px;
    }

    /* =========================================
       COLINAS DEL BOSQUE ENCANTADO
       ========================================= */
    .hills-back {
      position: absolute;
      bottom: 0;
      left: -10%;
      width: 120%;
      height: 24vh;
      background: radial-gradient(ellipse at 50% 0%, #1b4332 0%, #0d2818 65%, #05140c 100%);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      box-shadow: 0 -10px 35px rgba(27, 67, 50, 0.35);
      z-index: 4;
      pointer-events: none;
    }

    .hills-front {
      position: absolute;
      bottom: -2vh;
      left: -15%;
      width: 130%;
      height: 13vh;
      background: linear-gradient(180deg, #143627 0%, #081c15 55%, #030b08 100%);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.65);
      z-index: 15;
      pointer-events: none;
    }

    /* =========================================
       JARDÍN / RAMO DE TULIPANES INTERACTIVOS
       ========================================= */
    .garden {
      position: absolute;
      bottom: 4vh;
      left: 0;
      width: 100%;
      height: 58vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 10;
      pointer-events: none;
    }

    /* Punto de unión y lazo del ramo */
    .bouquet-ribbon {
      position: absolute;
      bottom: 7.5vh;
      left: 50%;
      transform: translateX(-50%);
      width: 68px;
      height: 22px;
      background: linear-gradient(90deg, #b83b5e, #f08a5d, #b83b5e);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.4);
      z-index: 14;
      pointer-events: none;
    }

    .bouquet-ribbon::before,
    .bouquet-ribbon::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 34px;
      height: 28px;
      background: linear-gradient(135deg, #f08a5d, #b83b5e);
      border-radius: 50% 12% 50% 12%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    .bouquet-ribbon::before {
      right: 85%;
      transform: translateY(-50%) rotate(-18deg);
    }

    .bouquet-ribbon::after {
      left: 85%;
      transform: translateY(-50%) scaleX(-1) rotate(-18deg);
    }

    /* Contenedor individual de cada tulipán formando un ramo */
    .flower-wrapper {
      position: absolute;
      bottom: 2vh;
      left: 50%;
      transform-origin: bottom center;
      animation: swayTulip var(--sway-dur, 5s) ease-in-out infinite alternate;
      animation-delay: var(--sway-delay, 0s);
      pointer-events: auto;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .flower-wrapper:hover .tulip-head {
      filter: brightness(1.18) drop-shadow(0 0 18px rgba(255, 255, 255, 0.45));
    }

    @keyframes swayTulip {
      0% { transform: translateX(-50%) rotate(calc(var(--base-angle, 0deg) - var(--sway-angle, 3deg))); }
      50% { transform: translateX(-50%) rotate(calc(var(--base-angle, 0deg) + var(--sway-angle, 3deg) * 0.4)); }
      100% { transform: translateX(-50%) rotate(calc(var(--base-angle, 0deg) + var(--sway-angle, 3deg))); }
    }

    /* Tallo estilizado del tulipán */
    .stem {
      position: relative;
      width: var(--stem-w, 8px);
      height: var(--stem-h, 260px);
      background: linear-gradient(90deg, #1e6b43, #52b788, #2d6a4f);
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(82, 183, 136, 0.25);
    }

    /* Hojas largas y lanceoladas típicas de los tulipanes */
    .leaf {
      position: absolute;
      width: var(--leaf-w, 34px);
      height: var(--leaf-h, 135px);
      background: linear-gradient(160deg, #74c69d 0%, #2d6a4f 55%, #1b4332 100%);
      box-shadow: inset 2px 0 8px rgba(255, 255, 255, 0.2), 0 4px 12px rgba(0, 0, 0, 0.35);
    }

    .leaf.left {
      right: 40%;
      bottom: var(--leaf-bottom, 18%);
      border-radius: 100% 0 100% 0 / 85% 15% 85% 15%;
      transform-origin: bottom right;
      animation: tulipLeafLeft 4.2s ease-in-out infinite alternate;
    }

    .leaf.right {
      left: 40%;
      bottom: var(--leaf-bottom, 24%);
      border-radius: 0 100% 0 100% / 15% 85% 15% 85%;
      transform-origin: bottom left;
      animation: tulipLeafRight 4.6s ease-in-out infinite alternate;
    }

    @keyframes tulipLeafLeft {
      0% { transform: rotate(-16deg) scale(1); }
      100% { transform: rotate(-23deg) scale(1.03); }
    }

    @keyframes tulipLeafRight {
      0% { transform: rotate(16deg) scale(1); }
      100% { transform: rotate(23deg) scale(1.03); }
    }

    /* Cabeza de copa del tulipán */
    .tulip-head {
      position: absolute;
      top: calc(var(--tulip-h, 88px) * -0.82);
      left: 50%;
      width: var(--tulip-w, 66px);
      height: var(--tulip-h, 88px);
      transform: translateX(-50%);
      animation: tulipBreathe 4.5s ease-in-out infinite alternate;
      transition: filter 0.3s ease;
    }

    .flower-wrapper.clicked .tulip-head {
      animation: tulipPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes tulipPop {
      0% { transform: translateX(-50%) scale(1); }
      45% { transform: translateX(-50%) scale(1.25) rotate(6deg); }
      100% { transform: translateX(-50%) scale(1); }
    }

    @keyframes tulipBreathe {
      0% { transform: translateX(-50%) scale(0.98); }
      100% { transform: translateX(-50%) scale(1.03); }
    }

    /* Pétalos traseros internos del tulipán */
    .t-petal-back {
      position: absolute;
      bottom: 4%;
      width: 58%;
      height: 92%;
      background: linear-gradient(180deg, var(--p-light) 0%, var(--p-mid) 60%, var(--p-dark) 100%);
      border-radius: 50% 50% 45% 45% / 75% 75% 25% 25%;
      box-shadow: 0 0 18px var(--p-glow);
      filter: brightness(0.88);
    }

    .t-petal-back.left {
      left: 10%;
      transform: rotate(-14deg);
    }

    .t-petal-back.right {
      right: 10%;
      transform: rotate(14deg);
    }

    /* Pétalos laterales envolventes */
    .t-petal-side {
      position: absolute;
      bottom: 0;
      width: 64%;
      height: 96%;
      background: linear-gradient(180deg, var(--p-light) 0%, var(--p-mid) 55%, var(--p-dark) 100%);
      box-shadow:
        inset 0 4px 10px rgba(255, 255, 255, 0.45),
        inset 0 -8px 14px rgba(0, 0, 0, 0.25);
      z-index: 2;
    }

    .t-petal-side.left {
      left: 0;
      border-radius: 65% 35% 40% 60% / 75% 60% 40% 25%;
      transform: rotate(-9deg);
    }

    .t-petal-side.right {
      right: 0;
      border-radius: 35% 65% 60% 40% / 60% 75% 25% 40%;
      transform: rotate(9deg);
    }

    /* Pétalo central frontal del tulipán */
    .t-petal-center {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 66%;
      height: 100%;
      background: radial-gradient(circle at 50% 25%, var(--p-light) 0%, var(--p-mid) 58%, var(--p-dark) 100%);
      border-radius: 50% 50% 45% 45% / 78% 78% 22% 22%;
      box-shadow:
        0 0 20px var(--p-glow),
        inset 0 6px 12px rgba(255, 255, 255, 0.55),
        inset 0 -8px 14px rgba(0, 0, 0, 0.22);
      z-index: 3;
    }

    /* Partículas flotantes al hacer clic en un tulipán */
    .sparkle-burst {
      position: fixed;
      pointer-events: none;
      z-index: 30;
      font-size: 1.25rem;
      animation: floatHeart 1.4s ease-out forwards;
    }

    @keyframes floatHeart {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.6);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx, 0px), var(--ty, -90px)) scale(1.35);
      }
    }

    /* =========================================
       DISPOSICIÓN EN RAMO Y COLORES DE TULIPANES
       ========================================= */
    .tulip-center {
      z-index: 13;
      --base-angle: 0deg;
      --stem-h: clamp(240px, 36vh, 345px);
      --stem-w: 9px;
      --tulip-w: clamp(64px, 8.5vw, 82px);
      --tulip-h: clamp(86px, 11.5vw, 112px);
      --sway-dur: 5.4s;
      --sway-angle: 2.5deg;
      --p-light: #ffccd5;
      --p-mid: #ff4d6d;
      --p-dark: #a4133c;
      --p-glow: rgba(255, 77, 109, 0.45);
    }

    .tulip-left-1 {
      z-index: 12;
      --base-angle: -11deg;
      --stem-h: clamp(225px, 33.5vh, 320px);
      --stem-w: 8px;
      --tulip-w: clamp(60px, 8vw, 76px);
      --tulip-h: clamp(80px, 10.8vw, 104px);
      --sway-dur: 4.9s;
      --sway-delay: -1.1s;
      --sway-angle: 3deg;
      --p-light: #f3d5ff;
      --p-mid: #b5179e;
      --p-dark: #560bad;
      --p-glow: rgba(181, 23, 158, 0.42);
    }

    .tulip-right-1 {
      z-index: 12;
      --base-angle: 11deg;
      --stem-h: clamp(228px, 34vh, 325px);
      --stem-w: 8px;
      --tulip-w: clamp(60px, 8vw, 76px);
      --tulip-h: clamp(80px, 10.8vw, 104px);
      --sway-dur: 5.1s;
      --sway-delay: -2.2s;
      --sway-angle: 3deg;
      --p-light: #fff3b0;
      --p-mid: #ffb703;
      --p-dark: #e85d04;
      --p-glow: rgba(255, 183, 3, 0.42);
    }

    .tulip-left-2 {
      z-index: 11;
      --base-angle: -22deg;
      --stem-h: clamp(200px, 29.5vh, 285px);
      --stem-w: 7px;
      --tulip-w: clamp(56px, 7.5vw, 72px);
      --tulip-h: clamp(75px, 10vw, 98px);
      --sway-dur: 4.5s;
      --sway-delay: -0.7s;
      --sway-angle: 3.5deg;
      --p-light: #ffd6ba;
      --p-mid: #ff758f;
      --p-dark: #c9184a;
      --p-glow: rgba(255, 117, 143, 0.4);
    }

    .tulip-right-2 {
      z-index: 11;
      --base-angle: 22deg;
      --stem-h: clamp(202px, 30vh, 290px);
      --stem-w: 7px;
      --tulip-w: clamp(56px, 7.5vw, 72px);
      --tulip-h: clamp(75px, 10vw, 98px);
      --sway-dur: 4.7s;
      --sway-delay: -1.8s;
      --sway-angle: 3.5deg;
      --p-light: #ffffff;
      --p-mid: #ffccd5;
      --p-dark: #e5989b;
      --p-glow: rgba(255, 230, 235, 0.45);
    }

    .tulip-front-left {
      z-index: 14;
      --base-angle: -6deg;
      --stem-h: clamp(180px, 26.5vh, 255px);
      --stem-w: 8px;
      --tulip-w: clamp(58px, 7.8vw, 74px);
      --tulip-h: clamp(78px, 10.5vw, 102px);
      --sway-dur: 5.0s;
      --sway-delay: -1.5s;
      --sway-angle: 2.8deg;
      --p-light: #ff8fa3;
      --p-mid: #d90429;
      --p-dark: #800f2f;
      --p-glow: rgba(217, 4, 41, 0.45);
    }

    .tulip-front-right {
      z-index: 14;
      --base-angle: 6deg;
      --stem-h: clamp(182px, 27vh, 260px);
      --stem-w: 8px;
      --tulip-w: clamp(58px, 7.8vw, 74px);
      --tulip-h: clamp(78px, 10.5vw, 102px);
      --sway-dur: 5.2s;
      --sway-delay: -2.6s;
      --sway-angle: 2.8deg;
      --p-light: #ffe5d9;
      --p-mid: #fb8500;
      --p-dark: #bb3e03;
      --p-glow: rgba(251, 133, 0, 0.42);
    }

    /* Brizna de hierba / follaje silvestre en la base */
    .grass-tuft {
      position: absolute;
      bottom: 2vh;
      width: 100%;
      height: 12vh;
      z-index: 15;
      pointer-events: none;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
    }

    .blade {
      width: 8px;
      height: var(--h, 75px);
      background: linear-gradient(to top, #081c15, #2d6a4f, #52b788);
      border-radius: 100% 0 0 0;
      transform-origin: bottom center;
      animation: swayBlade var(--dur, 3.5s) ease-in-out infinite alternate;
      animation-delay: var(--delay, 0s);
      opacity: 0.85;
    }

    @keyframes swayBlade {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }

    @media (max-width: 600px) {
      .quote-container {
        margin-top: 1rem;
        padding: 1rem 1.2rem;
      }
      .bouquet-ribbon {
        bottom: 6.5vh;
        width: 56px;
        height: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="Ramo de tulipanes encantado con frases de películas">
    <!-- Luna brillante -->
    <div class="moon" aria-hidden="true"></div>

    <!-- Cielo estrellado -->
    <div class="stars" aria-hidden="true">
      <span class="star" style="top: 8%; left: 10%; width: 3px; height: 3px; --dur: 2.8s; --delay: 0.2s;"></span>
      <span class="star" style="top: 15%; left: 24%; width: 2px; height: 2px; --dur: 3.5s; --delay: 1.1s;"></span>
      <span class="star" style="top: 6%; left: 42%; width: 3.5px; height: 3.5px; --dur: 4.1s; --delay: 0.5s;"></span>
      <span class="star" style="top: 19%; left: 58%; width: 2px; height: 2px; --dur: 2.4s; --delay: 1.7s;"></span>
      <span class="star" style="top: 11%; left: 73%; width: 3px; height: 3px; --dur: 3.9s; --delay: 0.9s;"></span>
      <span class="star" style="top: 24%; left: 15%; width: 2.5px; height: 2.5px; --dur: 3.1s; --delay: 2.0s;"></span>
      <span class="star" style="top: 28%; left: 36%; width: 2px; height: 2px; --dur: 4.5s; --delay: 0.4s;"></span>
      <span class="star" style="top: 22%; left: 82%; width: 3px; height: 3px; --dur: 2.7s; --delay: 1.3s;"></span>
      <span class="star" style="top: 34%; left: 66%; width: 2px; height: 2px; --dur: 3.6s; --delay: 2.3s;"></span>
      <span class="star" style="top: 14%; left: 91%; width: 2.5px; height: 2.5px; --dur: 3.2s; --delay: 0.8s;"></span>
      <span class="star" style="top: 38%; left: 8%; width: 2px; height: 2px; --dur: 4.0s; --delay: 1.5s;"></span>
      <span class="star" style="top: 31%; left: 49%; width: 2.5px; height: 2.5px; --dur: 2.9s; --delay: 0.1s;"></span>
    </div>

    <!-- Tarjeta de frases románticas -->
    <header class="quote-container" id="quoteCard">
      <div class="quote-ornament" id="quoteOrnament">✦ Un detalle del bosque encantado ✦</div>
      <blockquote class="quote-text" id="quoteText">
        “Vi esta flor y pensé en ti porque es bonita... y bueno, en realidad a mí no me gusta, pero creí que te gustaría porque <span class="highlight">tú sí eres bonita</span>.”

  <script>
    // Colección de frases románticas de películas
    const movieQuotes = [
      {
        ornament: "✦ Un detalle del bosque encantado ✦",
        html: '“Vi esta flor y pensé en ti porque es bonita... y bueno, en realidad a mí no me gusta, pero creí que te gustaría porque <span class="highlight">tú sí eres bonita</span>.”',
        author: "— Shrek a Fiona (Shrek)"
      },
      {
        ornament: "✦ Una aventura juntos ✦",
        html: '“Puede que no sea un hombre muy listo, pero <span class="highlight">sé lo que es el amor</span>.”',
        author: "— Forrest Gump (Forrest Gump)"
      },
      {
        ornament: "✦ Más allá de las estrellas ✦",
        html: '“El amor es lo único que somos capaces de percibir que <span class="highlight">trasciende las dimensiones del tiempo y del espacio</span>.”',
        author: "— Dra. Amelia Brand (Interestelar)"
      },
      {
        ornament: "✦ Magia eterna ✦",
        html: '“¿Después de todo este tiempo? <span class="highlight">Siempre</span>.”',
        author: "— Severus Snape (Harry Potter)"
      },
      {
        ornament: "✦ Contigo a cualquier parte ✦",
        html: '“Prefiero compartir <span class="highlight">una sola vida contigo</span> que enfrentar todas las edades de este mundo sola.”',
        author: "— Arwen (El Señor de los Anillos)"
      },
      {
        ornament: "✦ Amor verdadero ✦",
        html: '“Te quiero. <span class="highlight">Lo sé</span>.”',
        author: "— Leia Organa y Han Solo (Star Wars)"
      },
      {
        ornament: "✦ Luz en la oscuridad ✦",
        html: '“De pronto todo cambió, <span class="highlight">y ahora veo en ti la luz</span>.”',
        author: "— Rapunzel y Flynn Rider (Enredados)"
      },
      {
        ornament: "✦ Un corazón gigante ✦",
        html: '“Algunas personas <span class="highlight">valen la pena derretirse</span> por ellas.”',
        author: "— Olaf (Frozen)"
      },
      {
        ornament: "✦ Destino escrito ✦",
        html: '“El mejor tipo de amor es aquel que <span class="highlight">despierta el alma</span> y nos hace aspirar a más.”',
        author: "— Noah Calhoun (Diario de una Pasión)"
      },
      {
        ornament: "✦ Promesa infinita ✦",
        html: '“Te amaré hasta que se apague la última estrella... <span class="highlight">y después también</span>.”',
        author: "— Poema de Cine Romántico"
      }
    ];

    let currentQuoteIndex = 0;

    const quoteCard = document.getElementById("quoteCard");
    const quoteOrnament = document.getElementById("quoteOrnament");
    const quoteText = document.getElementById("quoteText");
    const quoteAuthor = document.getElementById("quoteAuthor");
    const flowers = document.querySelectorAll(".flower-wrapper");

    // Función para generar destellos y corazones al tocar un tulipán
    function spawnSparkles(x, y) {
      const symbols = ["✨", "💖", "🌷", "💫", "💛"];
      for (let i = 0; i < 6; i++) {
        const spark = document.createElement("span");
        spark.className = "sparkle-burst";
        spark.textContent = symbols[Math.floor(Math.random() * symbols.length)];

        const angle = (Math.PI * 2 * i) / 6 + (Math.random() * 0.5 - 0.25);
        const distance = 45 + Math.random() * 55;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance - 45;

        spark.style.left = `${x}px`;
        spark.style.top = `${y}px`;
        spark.style.setProperty("--tx", `${tx}px`);
        spark.style.setProperty("--ty", `${ty}px`);

        document.body.appendChild(spark);
        setTimeout(() => spark.remove(), 1400);
      }
    }

    // Cambia a la siguiente frase romántica de película
    function showNextQuote(flowerEl, clientX, clientY) {
      flowerEl.classList.remove("clicked");
      void flowerEl.offsetWidth;
      flowerEl.classList.add("clicked");

      if (clientX === undefined || clientY === undefined) {
        const rect = flowerEl.getBoundingClientRect();
        clientX = rect.left + rect.width / 2;
        clientY = rect.top + 30;
      }

      spawnSparkles(clientX, clientY);

      currentQuoteIndex = (currentQuoteIndex + 1) % movieQuotes.length;
      const nextQuote = movieQuotes[currentQuoteIndex];

      quoteText.style.opacity = "0";
      quoteAuthor.style.opacity = "0";
      quoteCard.classList.add("pulse");

      setTimeout(() => {
        quoteOrnament.textContent = nextQuote.ornament;
        quoteText.innerHTML = nextQuote.html;
        quoteAuthor.textContent = nextQuote.author;

        quoteText.style.opacity = "1";
        quoteAuthor.style.opacity = "1";
        quoteCard.classList.remove("pulse");
      }, 220);
    }

    // Asignar eventos de clic y teclado a cada tulipán
    flowers.forEach((flower) => {
      flower.addEventListener("click", (e) => {
        showNextQuote(flower, e.clientX, e.clientY);
      });

      flower.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          showNextQuote(flower);
        }
      });
    });
  </script>
